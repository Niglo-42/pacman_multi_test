[project]
name = "pacman"
version = "0.1.0"
description = "As in the title: Pac-Man project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mazegenerator",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.mypy]
exclude = ['\.venv']
plugins = ['pydantic.mypy']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pacman"]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }
